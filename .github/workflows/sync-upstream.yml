name: Sync upstream

on:
  schedule:
    - cron: "0 4 * * *"   # täglich 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add upstream https://github.com/5etools-mirror-3/5etools-src.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          # Bei Konflikten schlägt der Job fehl -> du bekommst eine Mail und mergst lokal
          git merge --no-edit upstream/main
          if [ "$before" != "$(git rev-parse HEAD)" ]; then
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes mit GITHUB_TOKEN triggern keine anderen Workflows,
      # workflow_dispatch aber schon -> Build explizit anstoßen
      - name: Trigger build
        if: steps.merge.outputs.changed == 'true'
        run: gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
