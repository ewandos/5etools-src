name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.nas
          push: true
          # Bei ARM-Synology (z. B. j-Modelle) zusätzlich: linux/arm64
          platforms: linux/amd64
          # Image-Name muss kleingeschrieben sein
          tags: ghcr.io/ewandos/5etools-custom:latest
          # Layer-Cache zwischen Builds => unveränderte Layer behalten ihren Digest
          cache-from: type=gha
          cache-to: type=gha,mode=max
